# ========================
# SuperMandi 2.0 — Common Config
# ========================
spring.application.name=supermandi

# Server
server.port=${PORT:8080}

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/supermandi}

# JWT
app.jwt.secret=${JWT_SECRET:supermandi_jwt_secret_key_please_change_in_production_2024}
app.jwt.expiration-ms=604800000
app.jwt.refresh-expiration-ms=2592000000

# Gemini AI
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.models=gemini-2.5-flash,gemini-2.0-flash,gemini-1.5-flash

# CORS
app.cors.allowed-origins=${CLIENT_URL:*}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
